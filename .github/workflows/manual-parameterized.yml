name: Parameterized Manual Workflow

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: "Name of the application"
        required: true
        type: string

      run_validation:
        description: "Run validation"
        required: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      validation_status: ${{ steps.validation.outputs.validation_status }}

    steps:
      - name: Print runtime inputs
        run: |
          echo "Application Name: ${{ inputs.application_name }}"
          echo "Run Validation: ${{ inputs.run_validation }}"

      - name: Determine validation result
        id: validation
        run: |
          if [ "${{ inputs.run_validation }}" = "true" ]; then
            echo "Validation enabled"
            echo "validation_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Validation skipped"
            echo "validation_status=skipped" >> "$GITHUB_OUTPUT"
          fi

  summary:
    needs: validate
    if: needs.validate.outputs.validation_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Print execution summary
        run: |
          echo "Final execution summary"
          echo "Application: ${{ inputs.application_name }}"
          echo "Validation completed successfully."
